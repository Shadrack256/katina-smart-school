<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Teachers | KatinaSmartSchool</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        body { background-color: #f4f7f6; display: block; }
        
        /* Navigation */
        .navbar {
            background-color: #2b8b83; color: white; padding: 15px 30px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .navbar h1 { font-size: 20px; margin: 0; }
        .nav-links a { color: white; text-decoration: none; margin-right: 20px; font-weight: bold; }
        
        /* Layout */
        .container { padding: 30px; max-width: 1200px; margin: 0 auto; display: flex; gap: 30px; flex-wrap: wrap; }
        
        /* Form Section */
        .form-section { flex: 1; min-width: 300px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .form-section h2 { color: #2b8b83; margin-bottom: 20px; font-size: 18px; }
        
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 13px; color: #555; margin-bottom: 5px; }
        .input-group input, .input-group select {
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px;
        }
        .input-group input:focus, .input-group select:focus { border-color: #2b8b83; outline: none; }
        
        .submit-btn {
            width: 100%; background: #2b8b83; color: white; border: none;
            padding: 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 15px;
        }
        .submit-btn:hover { background: #206b64; }
        
        /* Table Section */
        .table-section { flex: 2; min-width: 500px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .table-section h2 { color: #2b8b83; margin-bottom: 20px; font-size: 18px; }
        
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background-color: #f8f9fa; color: #333; font-weight: bold; }
        tr:hover { background-color: #f1f1f1; }
        
        .delete-btn {
            background: #ff4d4d; color: white; border: none; padding: 5px 10px;
            border-radius: 3px; cursor: pointer; font-size: 12px;
        }
        .delete-btn:hover { background: #e60000; }
        
        /* Messages */
        .alert { padding: 10px; margin-bottom: 15px; border-radius: 4px; font-size: 14px; display: none; }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

    <!-- Navigation -->
    <div class="navbar">
        <h1>KatinaSmartSchool</h1>
        <div class="nav-links">
            <a href="admin-dashboard.html">Dashboard</a>
            <a href="manage-students.html">Students</a>
            <a href="#" id="logoutBtn">Logout</a>
        </div>
    </div>

    <!-- Main Container -->
    <div class="container">
        
        <!-- ADD TEACHER FORM -->
        <div class="form-section">
            <h2>Add New Teacher</h2>
            
            <div id="formAlert" class="alert"></div>

            <form id="addTeacherForm">
                <div class="input-group">
                    <label>Staff ID *</label>
                    <input type="text" id="staffId" placeholder="e.g. TCH/001" required>
                </div>
                
                <div class="input-group">
                    <label>Full Name *</label>
                    <input type="text" id="fullName" placeholder="e.g. Mr. David Okello" required>
                </div>
                
                <div class="input-group">
                    <label>Main Subject</label>
                    <select id="subject">
                        <option value="">Select Subject</option>
                        <option value="Mathematics">Mathematics</option>
                        <option value="English">English</option>
                        <option value="Physics">Physics</option>
                        <option value="Chemistry">Chemistry</option>
                        <option value="Biology">Biology</option>
                        <option value="History">History</option>
                        <option value="Geography">Geography</option>
                        <option value="Literature">Literature</option>
                        <option value="CRE/IRE">CRE/IRE</option>
                        <option value="Computer Science">Computer Science</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Phone Number</label>
                    <input type="text" id="phone" placeholder="e.g. 0770123456">
                </div>

                <button type="submit" class="submit-btn" id="saveBtn">Save Teacher</button>
            </form>
        </div>

        <!-- TEACHER LIST TABLE -->
        <div class="table-section">
            <h2>Registered Teachers</h2>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Staff ID</th>
                            <th>Name</th>
                            <th>Subject</th>
                            <th>Phone</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="teacherTableBody">
                        <tr><td colspan="5" style="text-align:center;">Loading teachers...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/config.js"></script>
    <script>
        // 1. Protect the page
        db.auth.getSession().then(({ data: { session } }) => {
            if (!session) window.location.href = '../index.html';
        });

        // 2. Logout
        document.getElementById('logoutBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            await db.auth.signOut();
            window.location.href = '../index.html';
        });

        // 3. Fetch and Display Teachers
        async function loadTeachers() {
            const tbody = document.getElementById('teacherTableBody');
            
            const { data: teachers, error } = await db
                .from('teachers')
                .select('*')
                .order('full_name', { ascending: true });

            if (error) {
                console.error("Error loading teachers:", error);
                tbody.innerHTML = `<tr><td colspan="5" style="color:red; text-align:center;">Failed to load teachers.</td></tr>`;
                return;
            }

            if (teachers.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">No teachers found. Add one above.</td></tr>`;
                return;
            }

            tbody.innerHTML = teachers.map(teacher => `
                <tr>
                    <td><strong>${teacher.staff_id}</strong></td>
                    <td>${teacher.full_name}</td>
                    <td>${teacher.subject || '-'}</td>
                    <td>${teacher.phone || '-'}</td>
                    <td>
                        <button class="delete-btn" onclick="deleteTeacher('${teacher.id}')">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        // 4. Handle Add Teacher Form Submission
        document.getElementById('addTeacherForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('saveBtn');
            const alertBox = document.getElementById('formAlert');
            
            btn.textContent = 'Saving...';
            btn.disabled = true;
            alertBox.style.display = 'none';

            const newTeacher = {
                staff_id: document.getElementById('staffId').value.trim(),
                full_name: document.getElementById('fullName').value.trim(),
                subject: document.getElementById('subject').value,
                phone: document.getElementById('phone').value.trim()
            };

            const { error } = await db.from('teachers').insert([newTeacher]);

            if (error) {
                alertBox.textContent = "Error: " + error.message;
                alertBox.className = "alert alert-error";
                alertBox.style.display = 'block';
            } else {
                alertBox.textContent = "Teacher added successfully!";
                alertBox.className = "alert alert-success";
                alertBox.style.display = 'block';
                
                document.getElementById('addTeacherForm').reset();
                loadTeachers();
            }

            btn.textContent = 'Save Teacher';
            btn.disabled = false;
        });

        // 5. Delete Teacher Function
        async function deleteTeacher(teacherId) {
            if (!confirm("Are you sure you want to delete this teacher?")) return;

            const { error } = await db.from('teachers').delete().eq('id', teacherId);

            if (error) {
                alert("Error deleting teacher: " + error.message);
            } else {
                loadTeachers();
            }
        }

        loadTeachers();
    </script>
</body>
</html>
