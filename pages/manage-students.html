<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Students | KatinaSmartSchool</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        body { background-color: #f4f7f6; display: block; }
        .navbar { background-color: #2b8b83; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .navbar h1 { font-size: 20px; margin: 0; }
        .nav-links a { color: white; text-decoration: none; margin-right: 20px; font-weight: bold; }
        .container { padding: 30px; max-width: 1200px; margin: 0 auto; display: flex; gap: 30px; flex-wrap: wrap; }
        
        .form-section { flex: 1; min-width: 300px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid #eee; }
        .tab-btn { flex: 1; padding: 10px; background: none; border: none; font-size: 15px; font-weight: bold; cursor: pointer; color: #888; border-bottom: 2px solid transparent; margin-bottom: -2px; }
        .tab-btn.active { color: #2b8b83; border-bottom: 2px solid #2b8b83; }
        .tab-content { display: none; } .tab-content.active { display: block; }
        
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 13px; color: #555; margin-bottom: 5px; }
        .input-group input, .input-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        .submit-btn { width: 100%; background: #2b8b83; color: white; border: none; padding: 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 15px; }
        
        .table-section { flex: 2; min-width: 500px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .table-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .table-header h2 { color: #2b8b83; font-size: 18px; margin: 0; }
        
        /* SEARCH BAR STYLES */
        .search-bar { padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; width: 250px; }
        .search-bar:focus { border-color: #2b8b83; outline: none; }

        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background-color: #f8f9fa; color: #333; font-weight: bold; }
        tr:hover { background-color: #f1f1f1; }
        
        .delete-btn { background: #ff4d4d; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; font-size: 12px; }
        .alert { padding: 10px; margin-bottom: 15px; border-radius: 4px; font-size: 14px; display: none; }
        .alert-success { background: #d4edda; color: #155724; } .alert-error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>KatinaSmartSchool</h1>
        <div class="nav-links">
            <a href="javascript:history.back()">Back to Dashboard</a>
            <a href="#" id="logoutBtn">Logout</a>
        </div>
    </div>

    <div class="container">
        <div class="form-section">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('single')">Single Entry</button>
                <button class="tab-btn" onclick="switchTab('bulk')">Bulk CSV Import</button>
            </div>
            <div id="formAlert" class="alert"></div>

            <div id="single-tab" class="tab-content active">
                <form id="addStudentForm">
                    <div class="input-group"><label>Admission Number *</label><input type="text" id="admNo" required></div>
                    <div class="input-group"><label>Full Name *</label><input type="text" id="fullName" required></div>
                    <div class="input-group">
                        <label>Class Level *</label>
                        <select id="classLevel" required>
                            <option value="">Select Class</option><option value="S1">S1</option><option value="S2">S2</option><option value="S3">S3</option><option value="S4">S4</option><option value="S5">S5</option><option value="S6">S6</option>
                        </select>
                    </div>
                    <div class="input-group"><label>Gender</label><select id="gender"><option value="Male">Male</option><option value="Female">Female</option></select></div>
                    <div class="input-group"><label>Parent Phone</label><input type="text" id="parentPhone"></div>
                    <button type="submit" class="submit-btn" id="saveBtn">Save Student</button>
                </form>
            </div>

            <div id="bulk-tab" class="tab-content">
                <p style="font-size: 13px; color: #555; margin-bottom: 15px;">CSV Headers: <strong>admission_number, full_name, class_level, gender, parent_phone</strong></p>
                <div class="input-group"><input type="file" id="csvFileInput" accept=".csv"></div>
                <button type="button" class="submit-btn" id="uploadCsvBtn">Upload & Import</button>
            </div>
        </div>

        <div class="table-section">
            <div class="table-header">
                <h2>Registered Students</h2>
                <!-- SEARCH INPUT -->
                <input type="text" id="searchInput" class="search-bar" placeholder="Search by name or adm no...">
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr><th>Adm No.</th><th>Name</th><th>Class</th><th>Action</th></tr>
                    </thead>
                    <tbody id="studentTableBody">
                        <tr><td colspan="4" style="text-align:center;">Loading students...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="../assets/js/config.js"></script>
    <script>
        let allStudents = []; // Global array to store fetched data for searching

        db.auth.getSession().then(({ data: { session } }) => { if (!session) window.location.href = '../index.html'; });
        document.getElementById('logoutBtn').addEventListener('click', async (e) => { e.preventDefault(); await db.auth.signOut(); window.location.href = '../index.html'; });

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            if (tab === 'single') { document.querySelectorAll('.tab-btn')[0].classList.add('active'); document.getElementById('single-tab').classList.add('active'); }
            else { document.querySelectorAll('.tab-btn')[1].classList.add('active'); document.getElementById('bulk-tab').classList.add('active'); }
            document.getElementById('formAlert').style.display = 'none';
        }

        function showAlert(message, type) {
            const alertBox = document.getElementById('formAlert');
            alertBox.textContent = message; alertBox.className = `alert alert-${type}`; alertBox.style.display = 'block';
        }

        async function loadStudents() {
            const { data: students, error } = await db.from('students').select('*').order('admission_number', { ascending: true });
            if (!error && students) {
                allStudents = students;
                renderTable(allStudents);
            } else {
                document.getElementById('studentTableBody').innerHTML = `<tr><td colspan="4" style="color:red; text-align:center;">Failed to load students.</td></tr>`;
            }
        }

        // Render Table Function (Takes the filtered array)
        function renderTable(studentsToRender) {
            const tbody = document.getElementById('studentTableBody');
            if (studentsToRender.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;">No students found.</td></tr>`;
                return;
            }
            tbody.innerHTML = studentsToRender.map(student => `
                <tr>
                    <td><strong>${student.admission_number}</strong></td>
                    <td>${student.full_name}</td>
                    <td>${student.class_level}</td>
                    <td><button class="delete-btn" onclick="deleteStudent('${student.id}')">Delete</button></td>
                </tr>
            `).join('');
        }

        // SEARCH FILTER LOGIC
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allStudents.filter(s => 
                s.full_name.toLowerCase().includes(term) || 
                s.admission_number.toLowerCase().includes(term) ||
                s.class_level.toLowerCase().includes(term)
            );
            renderTable(filtered);
        });

        document.getElementById('addStudentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('saveBtn'); btn.textContent = 'Saving...'; btn.disabled = true;
            const newStudent = {
                admission_number: document.getElementById('admNo').value.trim(),
                full_name: document.getElementById('fullName').value.trim(),
                class_level: document.getElementById('classLevel').value,
                gender: document.getElementById('gender').value,
                parent_phone: document.getElementById('parentPhone').value.trim()
            };
            const { error } = await db.from('students').insert([newStudent]);
            if (error) { showAlert("Error: " + error.message, 'error'); } 
            else { showAlert("Student added!", 'success'); document.getElementById('addStudentForm').reset(); loadStudents(); }
            btn.textContent = 'Save Student'; btn.disabled = false;
        });

        document.getElementById('uploadCsvBtn').addEventListener('click', () => {
            const file = document.getElementById('csvFileInput').files[0];
            const btn = document.getElementById('uploadCsvBtn');
            if (!file) { showAlert("Please select a CSV file.", 'error'); return; }
            btn.textContent = 'Importing...'; btn.disabled = true;

            Papa.parse(file, { header: true, skipEmptyLines: true, complete: async function(results) {
                const cleanedData = results.data.map(row => ({
                    admission_number: row.admission_number ? row.admission_number.trim() : '',
                    full_name: row.full_name ? row.full_name.trim() : '',
                    class_level: row.class_level ? row.class_level.trim() : '',
                    gender: row.gender ? row.gender.trim() : '',
                    parent_phone: row.parent_phone ? row.parent_phone.trim() : ''
                }));
                const { error } = await db.from('students').insert(cleanedData);
                if (error) { showAlert("Import failed: " + error.message, 'error'); } 
                else { showAlert(`Successfully imported ${cleanedData.length} students!`, 'success'); document.getElementById('csvFileInput').value = ''; loadStudents(); }
                btn.textContent = 'Upload & Import'; btn.disabled = false;
            }});
        });

        window.deleteStudent = async function(id) {
            if (!confirm("Delete this student?")) return;
            await db.from('students').delete().eq('id', id);
            loadStudents();
        };

        loadStudents();
    </script>
</body>
</html>
