<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password | KatinaSmartSchool</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .reset-card {
            background: white; padding: 40px; border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 400px; margin: 50px auto; text-align: center;
        }
        .reset-card h2 { color: #2b8b83; margin-bottom: 20px; }
        .input-group { text-align: left; margin-bottom: 15px; }
        .input-group label { display: block; font-size: 13px; color: #555; margin-bottom: 5px; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        .btn { width: 100%; background: #2b8b83; color: white; border: none; padding: 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn:hover { background: #206b64; }
        .alert { padding: 10px; margin-bottom: 15px; border-radius: 4px; font-size: 14px; display: none; text-align: left;}
        .alert-success { background: #d4edda; color: #155724; }
        .alert-error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="reset-card">
        <h2>Reset Your Password</h2>
        <p style="font-size: 14px; color: #666; margin-bottom: 20px;">Enter your email and we'll send you a link to reset your password.</p>
        
        <div id="alertBox" class="alert"></div>

        <form id="resetForm">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="resetEmail" placeholder="e.g. student1@katikamu.ac.ug" required>
            </div>
            <button type="submit" class="btn" id="resetBtn">Send Reset Link</button>
        </form>
        
        <p style="margin-top: 20px; font-size: 14px;"><a href="../index.html" style="color: #2b8b83;">Back to Login</a></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/config.js"></script>
    <script>
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('resetBtn');
            const alertBox = document.getElementById('alertBox');
            const email = document.getElementById('resetEmail').value;

            btn.textContent = 'Sending...';
            btn.disabled = true;

            // Supabase function to send reset email
            const { error } = await db.auth.resetPasswordForEmail(email, {
                redirectTo: window.location.origin + '/pages/update-password.html', // Where to go after clicking email link
            });

            if (error) {
                alertBox.textContent = "Error: " + error.message;
                alertBox.className = "alert alert-error";
                alertBox.style.display = 'block';
            } else {
                alertBox.textContent = "Success! Check your email for the reset link.";
                alertBox.className = "alert alert-success";
                alertBox.style.display = 'block';
                document.getElementById('resetForm').reset();
            }
            btn.textContent = 'Send Reset Link';
            btn.disabled = false;
        });
    </script>
</body>
</html>
